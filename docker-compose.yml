services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dokon-boshqaruv:latest
    container_name: dokon_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Tashkent
      - PORT=3000
      - HOST=0.0.0.0
      - TRUST_PROXY=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
